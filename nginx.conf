map $http_x_forwarded_proto $site_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 2106;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Replace the SEO domain placeholder with the domain used for this request.
    # Coolify's reverse proxy forwards the original HTTPS scheme.
    sub_filter_types text/html text/plain application/xml;
    sub_filter_once off;
    sub_filter '__SITE_URL__' '$site_scheme://$host';

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
